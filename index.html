<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        <div class="theme-toggle">
            <button id="toggle-theme">Toggle Dark Mode</button>
        </div>
        <div class="game-stats">
            <p>X Wins: <span id="x-wins">0</span></p>
            <p>O Wins: <span id="o-wins">0</span></p>
            <p>Ties: <span id="ties">0</span></p>
        </div>
        <div class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button id="reset-game">Reset Game</button>
    </div>
    <script>
        const cells = document.querySelectorAll('.cell');
        const xWinsDisplay = document.getElementById('x-wins');
        const oWinsDisplay = document.getElementById('o-wins');
        const tiesDisplay = document.getElementById('ties');
        let xWins = 0;
        let oWins = 0;
        let ties = 0;
        let turn = 'X';
        let board = Array(9).fill(null);
        let soundEffect = new Audio('sound.mp3');

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const checkWin = (player) => {
            return winningCombinations.some(combination => {
                return combination.every(index => board[index] === player);
            });
        };

        const handleClick = (event) => {
            const index = event.target.dataset.index;
            if (board[index] || checkWin('X') || checkWin('O')) return;
            board[index] = turn;
            event.target.textContent = turn;
            soundEffect.play();
            if (checkWin(turn)) {
                alert(turn + ' wins!');
                turn === 'X' ? xWins++ : oWins++;
                xWinsDisplay.textContent = xWins;
                oWinsDisplay.textContent = oWins;
                resetBoard();
            } else if (board.every(cell => cell)) {
                ties++;
                tiesDisplay.textContent = ties;
                resetBoard();
            } else {
                turn = turn === 'X' ? 'O' : 'X';
            }
        };

        const resetBoard = () => {
            board.fill(null);
            cells.forEach(cell => cell.textContent = '');
        };

        const resetGame = () => {
            xWins = 0;
            oWins = 0;
            ties = 0;
            xWinsDisplay.textContent = xWins;
            oWinsDisplay.textContent = oWins;
            tiesDisplay.textContent = ties;
            resetBoard();
        };

        const toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
        };

        cells.forEach(cell => cell.addEventListener('click', handleClick));
        document.getElementById('reset-game').addEventListener('click', resetGame);
        document.getElementById('toggle-theme').addEventListener('click', toggleTheme);

        document.addEventListener('keydown', (event) => {
            if (event.key >= 1 && event.key <= 9) {
                const index = event.key - 1;
                if (!board[index]) handleClick({ target: cells[index] });
            } else if (event.key === 'r') {
                resetGame();
            }
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .dark-mode {
            background-color: #121212;
            color: white;
        }
        .game-container {
            text-align: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .cell:hover {
            background-color: #e0e0e0;
        }
        #reset-game {
            margin-top: 20px;
        }
    </style>
</body>
</html>
