<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white; /* Default light mode */
            color: black;
            transition: background-color 0.5s, color 0.5s;
        }
        #dark-mode {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .dark-mode {
            background-color: #2d2d2d;
            color: white;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #000;
            font-size: 24px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .cell:hover {
            background-color: #f3f3f3;
        }
        /* Add your animations and theme color schemes here */
    </style>
</head>
<body>
    <button id="dark-mode">Toggle Dark Mode</button>
    <div id="game-board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <div id="statistics"></div>

    <script>
        const cells = document.querySelectorAll('.cell');
        let currentPlayer = 'X';
        const statistics = { X: 0, O: 0 }; // Game statistics
        const audio = new Audio('click-sound.mp3'); // Sound effects

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                if (cell.textContent === '') {
                    cell.textContent = currentPlayer;
                    audio.play();
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                }
            });
        });

        document.getElementById('dark-mode').addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            const key = parseInt(e.key);
            if (key > 0 && key < 10) {
                const cell = cells[key - 1];
                if (cell.textContent === '') {
                    cell.textContent = currentPlayer;
                    audio.play();
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                }
            }
        });
        
        // Additional functions to manage statistics and game reset should be implemented
    </script>
</body>
</html>
